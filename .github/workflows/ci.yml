name: Backend CI

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, dev]
  workflow_call:
    inputs:
      checkout_ref:
        description: Git ref or SHA to verify
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_VERSION: "22"
  YARN_VERSION: "1.22.22"
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexora_ci?schema=public

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable pinned Yarn
        run: |
          corepack enable
          corepack prepare "yarn@${YARN_VERSION}" --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        run: yarn db:generate

      - name: Check formatting, lint and imports
        run: yarn biome ci .

      - name: Validate Prisma schema
        run: yarn prisma validate

      - name: Type-check source and unit tests
        run: yarn tsc --noEmit -p tsconfig.json

      - name: Build application
        run: yarn build

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable pinned Yarn
        run: |
          corepack enable
          corepack prepare "yarn@${YARN_VERSION}" --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        run: yarn db:generate

      - name: Run unit tests with coverage threshold
        run: yarn test:cov --runInBand

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: backend-coverage-${{ github.run_id }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      PORT: "3000"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexora_test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters-long
      GOOGLE_CLIENT_ID: ci-google-client
      GOOGLE_CLIENT_SECRET: ci-google-secret
      CLOUDINARY_CLOUD_NAME: ci-cloud
      CLOUDINARY_API_KEY: ci-cloud-key
      CLOUDINARY_API_SECRET: ci-cloud-secret
      GEMINI_API_KEY: ci-gemini-key
      GEMINI_MODEL: gemini-2.5-flash
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nexora_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexora_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable pinned Yarn
        run: |
          corepack enable
          corepack prepare "yarn@${YARN_VERSION}" --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        run: yarn db:generate

      - name: Apply database migrations
        run: yarn db:migrate:prod

      - name: Run end-to-end tests
        run: yarn test:e2e --runInBand --detectOpenHandles

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable pinned Yarn
        run: |
          corepack enable
          corepack prepare "yarn@${YARN_VERSION}" --activate

      - name: Fail on critical production vulnerabilities
        shell: bash
        run: |
          set +e
          yarn audit --groups dependencies --json > yarn-audit.json
          set -e

          summary_count="$(jq -s '[.[] | select(.type == "auditSummary")] | length' yarn-audit.json)"
          critical_count="$(jq -s '[.[] | select(
            .type == "auditAdvisory" and .data.advisory.severity == "critical"
          )] | length' yarn-audit.json)"
          high_count="$(jq -s '[.[] | select(
            .type == "auditAdvisory" and .data.advisory.severity == "high"
          )] | length' yarn-audit.json)"

          if [ "$summary_count" -eq 0 ]; then
            echo "::error::Yarn audit did not return a valid summary."
            exit 1
          fi

          echo "High advisories: $high_count"
          echo "Critical advisories: $critical_count"

          if [ "$critical_count" -gt 0 ]; then
            echo "::error::Critical production dependency vulnerabilities were found."
            exit 1
          fi

  docker-build:
    name: Docker build
    needs: [quality, unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          tags: nexora-be:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      [quality, unit-tests, integration-tests, dependency-audit, docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify all required checks
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          if echo "${RESULTS}" | grep -Eq 'failure|cancelled|skipped'; then
            echo "::error::At least one required CI job did not pass."
            exit 1
          fi
